apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: elasticsearch
spec:
  selector:
    matchLabels:
      app: fluentd  
  template:
    metadata:
      labels:
        app: fluentd 
    spec:
      containers:
        - name: fluentd-elasticsearch
          image:  fluent/fluentd-kubernetes-daemonset:v1.16-debian-elasticsearch7